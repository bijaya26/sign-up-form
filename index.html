<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <link rel="stylesheet" href="index.css">
        <script src="index.js" defer></script>
        <title>Signn-in-log-in</title>

    </head>
    <body>
        <div class="login-page">
            <div class="lefthand-image">
                <div class="logo">
                    <img src="media/odin-lined.png">
                    <h4>Odion</h4>
                </div>
            </div>
            <div class="wright-hand">
                <div class="initial-paragraph">
                    <p class="login-page-paragraph">This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams.
                    Sign up now to get started.</p>

                    <h2>you know you want to.</h2>
                </div>
                
                <div class="login-details">
                    <div class="fields">
                        <h3>Let's do this!</h3>
                        <form class="login-form">
                            <div class="login-control">
                                <label for="first-name">First Name:</label>
                                <input type="text" name="first-name" id="firsrt-name">

                            </div>
                            <div class="login-control">
                                <label for="last-name">Last Name:</label>
                                <input type="text" id="last-name" name="last-name">

                            </div>
                            
                            
                            <div class="login-control">
                                <label for="password">Password:</label>
                                <input type="password" id="password" name="password">
                            </div>
                            <div class="login-control">
                                <label for="confirm-password">Confirm Password:</label>
                                <input type="password" id="confirm-password" name="confirm-password">
                            </div>
                            
                        </form>
               
                    </div>
                    <div class="create-account">
                        <div><button class="create-for-login">Create Account</button></div>
                        <div><a href="https://www.facebook.com/?locale=en_GB">Already have an account login</a></div>
                        
                    </div>

                </div>

            </div>
        </div>

    </body>
</html>
